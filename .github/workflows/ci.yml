name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Seed data is up to date
        run: |
          pnpm seed
          git diff --exit-code -- packages/seed/data
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @bvac/web exec playwright install --with-deps chromium
      - name: Smoke tests (pages, accessibility, key flows)
        run: pnpm --filter @bvac/web e2e
      - name: Keep Playwright traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
